<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Shadow for depth -->
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Outer Circular Border -->
  <circle cx="250" cy="250" r="242" fill="#FFFFFF" stroke="#6B3E1E" stroke-width="3.5"/>

  <!-- Top Pan-African / Cameroon Swirls / Crown Ribbons -->
  <!-- 1. Green dynamic swirl (North-West) -->
  <path d="M 158 78 C 122 96, 92 135, 96 178 C 98 198, 108 215, 122 228 C 114 210, 108 185, 114 158 C 122 120, 148 95, 185 82 Z" fill="#00843D" />
  
  <!-- 2. Red dynamic wave (North) -->
  <path d="M 185 78 C 210 70, 240 68, 275 88 C 290 96, 305 88, 320 80 C 295 98, 268 98, 245 88 C 218 78, 198 82, 175 88 Z" fill="#D8232A" />
  
  <!-- 3. Yellow/Gold energetic sweep (North-East / Horn) -->
  <path d="M 324 88 C 330 115, 335 140, 350 162 C 368 188, 395 202, 402 200 C 378 195, 355 178, 342 152 C 332 132, 330 110, 324 88 Z" fill="#FCD116" />

  <!-- African Continent Outline (Connecting Horn, East Africa, South Africa to Woman Silhouette) -->
  <path d="M 350 162 
           C 370 175, 410 205, 395 240 
           C 380 270, 345 295, 360 330 
           C 370 350, 405 365, 406 372 
           C 385 382, 338 410, 326 440 
           C 300 470, 245 490, 235 488 
           C 220 485, 208 450, 212 410 
           C 215 375, 195 340, 192 322 
           C 188 300, 215 300, 250 290
           C 290 280, 310 250, 310 215" 
        fill="none" stroke="#6B3E1E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- African Woman Head & Turban Silhouette in Rich Brown (Forms West Africa) -->
  <g fill="#6B3E1E">
    <!-- Traditional Headdress / Headwrap (Turban) with artistic folds -->
    <path d="M 136 142 
             C 155 110, 200 95, 225 125 
             C 248 152, 230 185, 222 205 
             C 215 220, 208 238, 206 255 
             C 188 235, 175 225, 162 205 
             C 152 188, 142 165, 136 142 Z" />
    <path d="M 160 148 C 185 130, 215 135, 235 155 C 220 165, 190 160, 160 148 Z" fill="#522E14" opacity="0.4"/>
    <path d="M 148 180 C 172 165, 200 170, 218 188 C 200 195, 175 192, 148 180 Z" fill="#522E14" opacity="0.4"/>

    <!-- Woman Profile Silhouette: Forehead, Nose, Lips, Chin, Neck & Collarbone -->
    <path d="M 162 205 
             C 142 208, 132 215, 130 224 
             C 128 227, 126 230, 122 232
             C 125 235, 126 238, 123 243 
             C 124 247, 128 249, 125 254 
             C 127 257, 132 260, 135 264 
             C 140 270, 155 285, 160 300 
             C 165 315, 155 335, 145 352 
             C 165 348, 185 330, 195 305 
             C 205 280, 206 255, 206 255 
             C 190 235, 175 225, 162 205 Z" />
  </g>

  <!-- Typography: FAFE (Stylized) -->
  <g fill="#6B3E1E" font-family="'Plus Jakarta Sans', 'Playfair Display', sans-serif">
    <!-- FAFE Large Stylized Heading -->
    <text x="225" y="275" font-size="76" font-weight="900" letter-spacing="4" font-family="'Playfair Display', Georgia, serif">FAFE</text>
    
    <!-- Subtitle: Forum Africain des Femmes Entrepreneures -->
    <text x="225" y="306" font-size="21" font-weight="800" letter-spacing="0.5">Forum Africain</text>
    <text x="225" y="332" font-size="21" font-weight="800" letter-spacing="0.5">des Femmes</text>
    <text x="225" y="358" font-size="21" font-weight="800" letter-spacing="0.5">Entrepreneures</text>
  </g>

  <!-- Bottom National/Pan-African Chapter: CAMEROON (or PANAFRICAINE) -->
  <g font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="48" letter-spacing="6">
    <!-- CA (Green) -->
    <text x="100" y="445" fill="#00843D">CA</text>
    
    <!-- M (Red with Gold Star) -->
    <text x="222" y="445" fill="#D8232A">M</text>
    <polygon points="239,425 242,433 250,433 244,438 246,446 239,441 232,446 234,438 228,433 236,433" fill="#FCD116" />
    
    <!-- E (Red) -->
    <text x="272" y="445" fill="#D8232A">E</text>

    <!-- ROON (Yellow/Gold) -->
    <text x="312" y="445" fill="#FCD116">ROON</text>
  </g>
</svg>
